<!DOCTYPE html>
<html>
<head>
<title>My Bookings - Tractor Management</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:#2e7d32;
color:white;
text-align:center;
padding:20px;
}

.container{
width:90%;
margin:30px auto;
background:white;
padding:25px;
border-radius:6px;
box-shadow:0 0 8px gray;
}

table{
width:100%;
border-collapse:collapse;
}

table,th,td{
border:1px solid black;
}

th{
background:#388e3c;
color:white;
padding:10px;
}

td{
padding:8px;
text-align:center;
}

.paid{
color:green;
font-weight:bold;
}

.pending{
color:red;
font-weight:bold;
}

button{
padding:5px 10px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}
</style>

</head>

<body>

<header>
<h1>My Tractor Bookings</h1>
</header>

<div class="container">

<table id="bookingTable"></table>

</div>

<script>

// ✅ Two sample entries (one paid, one unpaid)
let bookings = JSON.parse(localStorage.getItem("bookings")) || [

{ name:"Ramesh", service:"Tractor", date:"2026-03-10", total:5000, paid:5000 }, // Paid

{ name:"Ritesh", service:"Worker", date:"2026-03-14", total:4000, paid:1500 }  // Pending

];

function loadTable(){

let table = document.getElementById("bookingTable");

table.innerHTML = `
<tr>
<th>Farmer Name</th>
<th>Service</th>
<th>Booking Date</th>
<th>Total Amount</th>
<th>Paid Amount</th>
<th>Remaining</th>
<th>Status</th>
<th>Action</th>
</tr>
`;

bookings.forEach((b,index)=>{

let remaining = b.total - b.paid;

// ✅ Correct status logic
let status = (remaining === 0) ? "Paid" : "Pending";

let row = table.insertRow(-1);

row.insertCell(0).innerHTML = b.name;
row.insertCell(1).innerHTML = b.service;
row.insertCell(2).innerHTML = b.date;
row.insertCell(3).innerHTML = "₹ " + b.total;
row.insertCell(4).innerHTML = "₹ " + b.paid;
row.insertCell(5).innerHTML = "₹ " + remaining;

let statusCell = row.insertCell(6);
statusCell.innerHTML = status;

if(status==="Paid"){
statusCell.classList.add("paid");
}else{
statusCell.classList.add("pending");
}

let actionCell = row.insertCell(7);

// ✅ Payment button for pending
if(status==="Pending"){

let btn=document.createElement("button");
btn.innerText="Pay";

btn.onclick=function(){

b.paid = b.total;

localStorage.setItem("bookings",JSON.stringify(bookings));

loadTable();

};

actionCell.appendChild(btn);

}else{

actionCell.innerHTML="✔ Paid";

}

});

}

loadTable();

</script>

</body>
</html>
