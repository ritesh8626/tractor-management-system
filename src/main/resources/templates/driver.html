<!DOCTYPE html>
<html>
<head>
    <title>Driver Record Book - Tractor Management</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 0 8px gray;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #2e7d32;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
        }

        table, th, td {
            border: 1px solid black;
        }

        th {
            background: #388e3c;
            color: white;
            padding: 8px;
        }

        td {
            padding: 8px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Driver Record Book</h1>
</header>

<div class="container">

    <label>Driver Name</label>
    <input type="text" id="driverName">

    <label>How Many Acres Covered</label>
    <input type="number" id="acres">

    <label>Total Hours Worked</label>
    <input type="number" id="hours">

    <button onclick="addRecord()">Add Record</button>

    <table id="recordTable">
        <tr>
            <th>Driver Name</th>
            <th>Acres Covered</th>
            <th>Total Hours Worked</th>
            <th>Total Fuel Used</th>
        </tr>
    </table>

</div>

<script>

function addRecord() {

    let name = document.getElementById("driverName").value;
    let acres = document.getElementById("acres").value;
    let hours = document.getElementById("hours").value;

    // Tractor average fuel consumption
    let fuelPerHour = 5;

    // Calculate total fuel
    let totalFuel = hours * fuelPerHour;

    let table = document.getElementById("recordTable");
    let newRow = table.insertRow(-1);

    newRow.insertCell(0).innerHTML = name;
    newRow.insertCell(1).innerHTML = acres + " Acres";
    newRow.insertCell(2).innerHTML = hours + " Hours";
    newRow.insertCell(3).innerHTML = totalFuel + " Litres";

    // Clear fields
    document.getElementById("driverName").value = "";
    document.getElementById("acres").value = "";
    document.getElementById("hours").value = "";
}

</script>

</body>
</html>
