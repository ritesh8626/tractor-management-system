<!DOCTYPE html>
<html>
<head>
<title>My Workers</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

table{
width:90%;
margin:30px auto;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#388e3c;
color:white;
}

button{
padding:6px 12px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.form-box{
width:90%;
margin:auto;
background:white;
padding:20px;
box-shadow:0 0 6px gray;
border-radius:6px;
}

input,select{
padding:8px;
margin:5px;
}

</style>
</head>

<body>

<header>
<h1>My Workers</h1>
</header>

<table id="workerTable">

<tr>
<th>Worker Name</th>
<th>Skill</th>
<th>Experience</th>
<th>Charge (₹/day)</th>
<th>Status</th>
<th>Action</th>
</tr>

<tr>
<td>Ramesh</td>
<td>Ploughing</td>
<td>5 Years</td>
<td>500</td>
<td class="status">Available</td>
<td><button onclick="editStatus(this)">Edit</button></td>
</tr>

<tr>
<td>Suresh</td>
<td>Harvesting</td>
<td>3 Years</td>
<td>450</td>
<td class="status">Not Available</td>
<td><button onclick="editStatus(this)">Edit</button></td>
</tr>

<tr>
<td>Chaitanya</td>
<td>Plumber</td>
<td>6 Years</td>
<td>500</td>
<td class="status">Not Available</td>
<td><button onclick="editStatus(this)">Edit</button></td>
       
</tr>
<tr>
<td>Rakesh</td>
<td>Seeder </td>
<td>1 Years</td>
<td>400/450</td>
<td class="status">Not Available</td>
<td><button onclick="editStatus(this)">Edit</button></td>
</tr>


</table>


<div class="form-box">

<h3>Add Worker</h3>

<input type="text" id="name" placeholder="Worker Name">
<input type="text" id="skill" placeholder="Skill">
<input type="text" id="experience" placeholder="Experience">
<input type="number" id="charge" placeholder="Charge per day">

<select id="status">
<option>Available</option>
<option>Not Available</option>
</select>

<button onclick="addWorker()">Add Worker</button>

</div>


<script>

function editStatus(button){

let row=button.parentElement.parentElement;

let statusCell=row.querySelector(".status");

if(statusCell.innerText==="Available"){
statusCell.innerText="Not Available";
}else{
statusCell.innerText="Available";
}

}


function addWorker(){

let name=document.getElementById("name").value;
let skill=document.getElementById("skill").value;
let experience=document.getElementById("experience").value;
let charge=document.getElementById("charge").value;
let status=document.getElementById("status").value;

if(name==="" || skill==="" || experience==="" || charge===""){
alert("Please fill all fields");
return;
}

let table=document.getElementById("workerTable");

let row=table.insertRow();

row.innerHTML=`
<td>${name}</td>
<td>${skill}</td>
<td>${experience}</td>
<td>${charge}</td>
<td class="status">${status}</td>
<td><button onclick="editStatus(this)">Edit</button></td>
`;

document.getElementById("name").value="";
document.getElementById("skill").value="";
document.getElementById("experience").value="";
document.getElementById("charge").value="";

}

</script>

</body>
</html>
