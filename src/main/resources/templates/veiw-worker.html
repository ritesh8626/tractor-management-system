<!DOCTYPE html>
<html>
<head>
<title>Workers</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

table{
width:90%;
margin:30px auto;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#388e3c;
color:white;
}

button{
padding:6px 12px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.form-box{
width:90%;
margin:auto;
background:white;
padding:20px;
box-shadow:0 0 6px gray;
border-radius:6px;
}

input,select{
padding:8px;
margin:5px;
}

</style>
</head>

<body>

<header>
<h1>My Workers</h1>
</header>

<table id="workerTable">

<tr>
<th>Worker Name</th>
<th>Skill</th>
<th>Experience</th>
<th>Charge (₹/day)</th>
<th>Status</th>
<th id="actionHeader">Action</th>
</tr>

<tr>
<td>Ramesh</td>
<td>Ploughing</td>
<td>5 Years</td>
<td>500</td>
<td class="status">Available</td>
<td class="action"><button onclick="editStatus(this)">Edit</button></td>
</tr>

<tr>
<td>Suresh</td>
<td>Harvesting</td>
<td>3 Years</td>
<td>450</td>
<td class="status">Not Available</td>
<td class="action"><button onclick="editStatus(this)">Edit</button></td>
</tr>

<tr>
<td>Chaitanya</td>
<td>Plumber</td>
<td>6 Years</td>
<td>500</td>
<td class="status">Available</td>
<td class="action"><button onclick="editStatus(this)">Edit</button></td>
</tr>

<tr>
<td>Rakesh</td>
<td>Seeder</td>
<td>1 Years</td>
<td>400</td>
<td class="status">Not Available</td>
<td class="action"><button onclick="editStatus(this)">Edit</button></td>
</tr>

</table>


<div class="form-box" id="addWorkerBox">

<h3>Add Worker</h3>

<input type="text" id="name" placeholder="Worker Name">
<input type="text" id="skill" placeholder="Skill">
<input type="text" id="experience" placeholder="Experience">
<input type="number" id="charge" placeholder="Charge per day">

<select id="status">
<option>Available</option>
<option>Not Available</option>
</select>

<button onclick="addWorker()">Add Worker</button>

</div>


<script>

/* Get role */

let role = localStorage.getItem("userRole");

/* If farmer hide admin controls */

if(role !== "admin"){

document.getElementById("addWorkerBox").style.display="none";

document.getElementById("actionHeader").style.display="none";

document.querySelectorAll(".action").forEach(el=>{
el.style.display="none";
});

}


/* Change Status */

function editStatus(button){

if(role !== "admin"){
alert("Only Admin can change status");
return;
}

let row=button.parentElement.parentElement;

let status=row.querySelector(".status");

if(status.innerText==="Available"){
status.innerText="Not Available";
}else{
status.innerText="Available";
}

}


/* Add Worker */

function addWorker(){

if(role !== "admin"){
alert("Only Admin can add workers");
return;
}

let name=document.getElementById("name").value;
let skill=document.getElementById("skill").value;
let experience=document.getElementById("experience").value;
let charge=document.getElementById("charge").value;
let status=document.getElementById("status").value;

if(name==="" || skill==="" || experience==="" || charge===""){
alert("Fill all fields");
return;
}

let table=document.getElementById("workerTable");

let row=table.insertRow();

row.innerHTML=`
<td>${name}</td>
<td>${skill}</td>
<td>${experience}</td>
<td>${charge}</td>
<td class="status">${status}</td>
<td class="action"><button onclick="editStatus(this)">Edit</button></td>
`;

}

</script>

</body>
</html>
