<!DOCTYPE html>
<html>
<head>
    <title>Add Tractor</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; }
        header { background:#2e7d32; color:white; padding:20px; text-align:center; }
        .form-box {
            background:white;
            width:400px;
            margin:40px auto;
            padding:25px;
            box-shadow:0 0 8px gray;
        }
        label { display:block; margin-top:10px; font-weight:bold; }
        input, select {
            width:100%;
            padding:8px;
            margin-top:5px;
        }
        button {
            margin-top:20px;
            width:100%;
            padding:10px;
            background:#2e7d32;
            color:white;
            border:none;
            font-size:16px;
            cursor:pointer;
        }
        button:hover { background:#1b5e20; }
    </style>
</head>

<body>

<header>
    <h1>Service Provider - Add Tractor</h1>
</header>

<div class="form-box">
    <form onsubmit="addTractor(); return false;">
        <label>Tractor Name</label>
        <input type="text" required>

        <label>Model</label>
        <input type="text" required>

        <label>Rent (₹ per hour)</label>
        <input type="number" required>

        <label>Status</label>
        <select>
            <option>Available</option>
            <option>Not Available</option>
        </select>

        <button type="submit">Add Tractor</button>
    </form>
</div>

<script>
    function addTractor() {
        alert("Tractor added successfully!");
    }
</script>

</body>
</html>
