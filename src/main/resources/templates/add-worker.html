<!DOCTYPE html>
<html>
<head>
    <title>My Workers</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; }
        header { background:#2e7d32; color:white; padding:20px; text-align:center; }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #388e3c;
            color: white;
        }

        button {
            padding: 6px 10px;
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover { background:#1b5e20; }
    </style>
</head>

<body>

<header>
    <h1>My Workers</h1>
</header>

<table>
    <tr>
        <th>Worker Name</th>
        <th>Skill</th>
        <th>Experience</th>
        <th>Charge (₹/day)</th>
        <th>Action</th>
    </tr>

    <tr>
        <td>Ramesh</td>
        <td>Ploughing</td>
        <td>5 Years</td>
        <td>500</td>
        <td><button>Edit</button></td>
    </tr>

    <tr>
        <td>Suresh</td>
        <td>Harvesting</td>
        <td>3 Years</td>
        <td>450</td>
        <td><button>Edit</button></td>
    </tr>
    <tr>
        <td>Chaitanya</td>
        <td>Plumber</td>
        <td>6 Years</td>
        <td>500</td>
        <td><button>Edit</button></td>
    </tr>
    <tr>
        <td>Rakesh</td>
        <td>Seeder </td>
        <td>1 Years</td>
        <td>400/450</td>
        <td><button>Edit</button></td>
    </tr>


</table>

</body>
</html>
