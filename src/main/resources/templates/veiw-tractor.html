<!DOCTYPE html>
<html>
<head>
    <title>My Tractors</title>
    <style>
        body { font-family: Arial; background:#f4f4f4; }
        header { background:#2e7d32; color:white; padding:20px; text-align:center; }

        table {
            width: 90%;
            margin: 30px auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #388e3c;
            color: white;
        }

        button {
            padding: 6px 10px;
            background: #2e7d32;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover { background:#1b5e20; }
    </style>
</head>

<body>

<header>
    <h1>My Tractors</h1>
</header>

<table>
    <tr>
        <th>Tractor Name</th>
        <th>Model</th>
        <th>Rent (₹/hour)</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    <tr>
        <td>Mahindra 575 DI</td>
        <td>2022</td>
        <td>800</td>
        <td>Available</td>
        <td><button>Edit</button></td>
    </tr>

    <tr>
        <td>Swaraj 744 FE</td>
        <td>2021</td>
        <td>900</td>
        <td>Not Available</td>
        <td><button>Edit</button></td>
    </tr>
</table>

</body>
</html>
