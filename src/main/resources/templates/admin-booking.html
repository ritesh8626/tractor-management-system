<!DOCTYPE html>
<html>
<head>
    <title>Admin - All Bookings</title>

    <style>
        body { font-family: Arial; margin:0; background:#f4f4f4; }

        header {
            background:#2e7d32;
            color:white;
            padding:20px;
            text-align:center;
        }

        table {
            width:90%;
            margin:30px auto;
            border-collapse: collapse;
            background:white;
        }

        th, td {
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

        th {
            background:#2e7d32;
            color:white;
        }

        h2 {
            text-align:center;
            margin-top:20px;
            color:#2e7d32;
        }

        button {
            padding:6px 10px;
            background:red;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
</header>

<h2>All Booking Records</h2>

<table id="bookingTable">
    <tr>
        <th>Tractor</th>
        <th>Attachment</th>
        <th>Hours</th>
        <th>Total (₹)</th>
        <th>Payment</th>
        <th>Date</th>
        <th>Action</th>
    </tr>
</table>

<script>

    let bookings = JSON.parse(localStorage.getItem("allBookings")) || [];

    let table = document.getElementById("bookingTable");

    bookings.forEach((b, index) => {
        let row = table.insertRow();

        row.insertCell(0).innerText = b.tractor;
        row.insertCell(1).innerText = b.attachment;
        row.insertCell(2).innerText = b.hours;
        row.insertCell(3).innerText = b.total;
        row.insertCell(4).innerText = b.paymentMethod;
        row.insertCell(5).innerText = b.date;

        let actionCell = row.insertCell(6);
        actionCell.innerHTML = `<button onclick="deleteBooking(${index})">Delete</button>`;
    });

    function deleteBooking(index) {

        let bookings = JSON.parse(localStorage.getItem("allBookings")) || [];
        bookings.splice(index, 1);
        localStorage.setItem("allBookings", JSON.stringify(bookings));

        location.reload();
    }

</script>

</body>
</html>
