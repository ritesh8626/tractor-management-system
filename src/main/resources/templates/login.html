<!DOCTYPE html>
<html>
<head>
<title>Login - Tractor Management</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

/* HEADER */

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

/* LOGIN BOX */

.login-container{
width:350px;
margin:80px auto;
background:white;
padding:25px;
border-radius:6px;
box-shadow:0 0 6px gray;
text-align:center;
}

input,select{
width:90%;
padding:10px;
margin:8px;
border:1px solid #ccc;
border-radius:4px;
}

button{
width:95%;
padding:10px;
background:#2e7d32;
color:white;
border:none;
cursor:pointer;
border-radius:4px;
font-size:15px;
}

button:hover{
background:#1b5e20;
}

</style>

</head>

<body>

<header>
<h1>Tractor Management System</h1>
</header>

<div class="login-container">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Enter Email">

<input type="password" id="password" placeholder="Enter Password">

<select id="role">
<option value="">Select Role</option>
<option value="admin">Admin</option>
<option value="farmer">Farmer</option>
</select>

<button onclick="loginUser()">Login</button>

</div>

<script>

function loginUser(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;
let role=document.getElementById("role").value;

if(email==="" || password==="" || role===""){
alert("Please fill all fields");
return;
}

/* Simple demo login */

if(role==="admin"){
localStorage.setItem("userRole","admin");
window.location.href="admin-dashboard.html";
}

else if(role==="farmer"){
localStorage.setItem("userRole","farmer");
window.location.href="farmer-dashboard.html";
}

}

</script>

</body>
</html>
