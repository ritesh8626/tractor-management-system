<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booking Page - Tractor Management</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f4f4;
}

header{
background:#2e7d32;
color:white;
padding:20px;
text-align:center;
}

.container{
background:white;
width:400px;
margin:40px auto;
padding:25px;
border-radius:6px;
box-shadow:0 0 8px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#2e7d32;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select{
width:100%;
padding:8px;
margin-top:5px;
}

button{
width:100%;
margin-top:20px;
padding:10px;
background:#2e7d32;
color:white;
border:none;
font-size:16px;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

</style>
</head>

<body>

<header>
<h1>Tractor Management</h1>
<p>Booking Page</p>
</header>

<div class="container">

<h2>Book a Service</h2>

<form onsubmit="submitBooking(); return false;">

<label>Farmer Name</label>
<input type="text" id="farmerName" required>

<label>Mobile Number</label>
<input type="text" id="mobile" required>

<label>Service Type</label>
<select id="serviceType" onchange="toggleWorkerType()" required>
<option value="">-- Select Service --</option>
<option value="Tractor">Tractor</option>
<option value="Worker">Farm Worker</option>
</select>

<label id="workerLabel" style="display:none;">Worker Type</label>
<select id="workerType" style="display:none;">
<option value="">-- Select Worker Type --</option>
<option>Ploughing Worker</option>
<option>Seeder Operator</option>
<option>Harvester Operator</option>
<option>Irrigation Worker</option>
</select>

<label>Booking Date</label>
<input type="date" id="date" required>

<button type="submit">Submit Booking</button>

</form>

</div>

<script>

function toggleWorkerType(){

let service=document.getElementById("serviceType").value;
let worker=document.getElementById("workerType");
let workerLabel=document.getElementById("workerLabel");

if(service==="Worker"){
worker.style.display="block";
workerLabel.style.display="block";
}else{
worker.style.display="none";
workerLabel.style.display="none";
}

}

function submitBooking(){

const bookingData={

farmerName:document.getElementById("farmerName").value,
mobile:document.getElementById("mobile").value,
serviceType:document.getElementById("serviceType").value,
workerType:document.getElementById("workerType").value,
bookingDate:document.getElementById("date").value

};

fetch("/api/bookings",{

method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(bookingData)

})
.then(response => response.json())
.then(data => {

alert("Booking Successful");

/* redirect to payment page */
window.location.href="payment.html";

})
.catch(error => {

console.log(error);

/* still redirect even if API fails */
window.location.href="payment.html";

});

}

</script>

</body>
</html>
